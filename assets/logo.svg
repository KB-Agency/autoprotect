    <rect x="626" y="117" width="18" height="16"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="9">
    <path d="M150 78 V14 H494 V78"/>
    <path d="M150 178 V242 H494 V178"/>
  </g>
  <text x="322" y="177" fill="currentColor" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
        font-weight="900" font-size="134"
        textLength="596" lengthAdjust="spacingAndGlyphs">AUTO PROTECT</text>
