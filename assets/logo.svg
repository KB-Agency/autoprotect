<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 215" role="img" aria-label="AUTO PROTECT">
  <title>AUTO PROTECT</title>
  <!-- Знак перерисован по превью из AUTO PROTECT logo -19.cdr: надпись в
       открытой рамке-скобке, по бокам короткие чёрточки. currentColor —
       чтобы знак наследовал цвет от места, куда его вставили. -->
  <g fill="currentColor">
    <rect x="0" y="99" width="18" height="16"/>
    <rect x="626" y="99" width="18" height="16"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="9">
    <path d="M150 62 V12 H494 V62"/>
    <path d="M150 153 V203 H494 V153"/>
  </g>
  <text x="322" y="143" fill="currentColor" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
        font-weight="900" font-size="100"
        textLength="596" lengthAdjust="spacingAndGlyphs">AUTO PROTECT</text>
</svg>
